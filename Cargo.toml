[package]
name = "lucciola"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
cudarc = { version = "0.18", features = [
    "default",
    "cuda-version-from-build-system",
    "f16",
] }
half = { version = "2.7", features = ["std", "num-traits"] }
memmap2 = "0.9"
rand = "0.9"
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.22"

[build-dependencies]
cudarc = { version = "0.18", features = [
    "default",
    "cuda-version-from-build-system",
    "f16",
] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
